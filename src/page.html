<!doctype html>
<!-- 待确认：Pages 生产域名。歧义：server 字段来自本次访问首页的请求。
     后续研究：公网探针实测。潜在优化：实测完整报告传输体积。
     风险：原值可能含凭据。验证重点：全文可选取、按行解析、窄屏换行。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>连接检测</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/client.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="title">连接检测</h1>
      <button id="language" type="button" lang="en">English</button>
    </header>

    <nav aria-label="Report actions">
      <button id="refresh" type="button" data-i18n="refresh" disabled>重新检测</button>
      <button id="copy-trace" type="button" data-i18n="copy" disabled>复制全文</button>
      <button id="download" type="button" data-i18n="download" disabled>下载 TXT</button>
      <button id="copy-summary" type="button" data-i18n="redacted" disabled>复制脱敏摘要</button>
    </nav>

    <p class="note" data-i18n="warning">全文可能包含 Cookie、认证头和查询参数。</p>
    <p id="status" role="status"></p>
    <pre id="trace-output" data-probe-input="{}" tabindex="0"><!--SERVER_TRACE-->traceVersion=1
server.status="unavailable"
browserOnly.status="not-run"
activeProbes.status="not-run"
<!--/SERVER_TRACE--></pre>
    <noscript>启用 JavaScript 后可检测浏览器和网络探针。</noscript>
  </main>
</body>
</html>
